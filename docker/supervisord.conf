[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/sshd.err.log
stdout_logfile=/var/log/supervisor/sshd.out.log

[program:nftables-init]
command=/bin/bash -c "sleep 2 && nft -f /etc/nftables.conf || true"
autostart=true
autorestart=false
startsecs=0
stderr_logfile=/var/log/supervisor/nftables.err.log
stdout_logfile=/var/log/supervisor/nftables.out.log

[program:rsyslog]
command=/usr/sbin/rsyslogd -n
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/rsyslog.err.log
stdout_logfile=/var/log/supervisor/rsyslog.out.log

[program:ulogd]
command=/usr/sbin/ulogd -c /etc/ulogd.conf
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/ulogd.err.log
stdout_logfile=/var/log/supervisor/ulogd.out.log

[program:keepalived]
command=/usr/sbin/keepalived --dont-fork --log-console --use-file=/etc/keepalived/keepalived.conf
autostart=false
autorestart=true
startretries=20
startsecs=2
stderr_logfile=/var/log/supervisor/keepalived.err.log
stdout_logfile=/var/log/supervisor/keepalived.out.log

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface