[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:sshd]
command=/usr/sbin/sshd -D
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/sshd.err.log
stdout_logfile=/var/log/supervisor/sshd.out.log

[program:nftables-init]
command=/bin/bash -c "sleep 2 && nft -f /etc/nftables.conf || true"
autostart=true
autorestart=false
startsecs=0
stderr_logfile=/var/log/supervisor/nftables.err.log
stdout_logfile=/var/log/supervisor/nftables.out.log
