apiVersion: apps/v1
kind: Deployment

metadata:
  name: firewall-deployment
  namespace: firewall

spec:
  replicas: 3

  selector:
    matchLabels:
      app: firewall

  template:
    metadata:
      labels:
        app: firewall

    spec:
      containers:
        - name: firewall
          image: firewall:latest
          imagePullPolicy: Never

          command:
            - /bin/sh
            - -c
            - sleep infinity

          securityContext:
            privileged: true

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            exec:
              command:
                - cat
                - /etc/nftables.conf
            initialDelaySeconds: 10
            periodSeconds: 30

          readinessProbe:
            exec:
              command:
                - cat
                - /etc/nftables.conf
            initialDelaySeconds: 5
            periodSeconds: 10

          ports:
            - containerPort: 22
            - containerPort: 80
            - containerPort: 443
