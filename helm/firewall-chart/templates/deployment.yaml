apiVersion: apps/v1
kind: Deployment
metadata:
  name: firewall-deployment
  namespace: firewall
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: firewall
  template:
    metadata:
      labels:
        app: firewall
    spec:
      containers:
        - name: firewall
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - sleep infinity
          securityContext:
            privileged: true
          resources:
{{ toYaml .Values.resources | indent 12 }}
          livenessProbe:
            exec:
              command:
                - test
                - -f
                - /etc/nftables.conf
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - test
                - -f
                - /etc/nftables.conf
            initialDelaySeconds: 5
            periodSeconds: 10
          ports:
            - name: ssh
              containerPort: {{ .Values.service.ports.ssh }}
            - name: http
              containerPort: {{ .Values.service.ports.http }}
            - name: https
              containerPort: {{ .Values.service.ports.https }}
          volumeMounts:
            - name: firewall-config
              mountPath: /etc/nftables.conf
              subPath: nftables.conf
      volumes:
        - name: firewall-config
          configMap:
            name: firewall-config
