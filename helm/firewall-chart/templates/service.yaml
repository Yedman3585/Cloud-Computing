apiVersion: v1
kind: Service
metadata:
  name: firewall-service
  namespace: firewall
spec:
  type: {{ .Values.service.type }}
  selector:
    app: firewall
  ports:
    - name: ssh
      port: {{ .Values.service.ports.ssh }}
      targetPort: ssh
    - name: http
      port: {{ .Values.service.ports.http }}
      targetPort: http
    - name: https
      port: {{ .Values.service.ports.https }}
      targetPort: https
