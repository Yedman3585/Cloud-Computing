apiVersion: v1
kind: Service

metadata:
  name: firewall-service
  namespace: firewall

spec:
  selector:
    app: firewall

  type: ClusterIP

  ports:
    - name: ssh
      port: 22
      targetPort: 22

    - name: http
      port: 80
      targetPort: 80

    - name: https
      port: 443
      targetPort: 443
