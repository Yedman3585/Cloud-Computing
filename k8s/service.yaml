apiVersion: v1
kind: Service
metadata:
  name: firewall-service
  namespace: firewall
spec:
  type: ClusterIP
  selector:
    app: firewall
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
    - name: http
      port: 80
      targetPort: http
    - name: https
      port: 443
      targetPort: https
