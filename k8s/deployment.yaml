apiVersion: apps/v1
kind: Deployment
metadata:
  name: firewall-deployment
  namespace: firewall
spec:
  replicas: 3
  selector:
    matchLabels:
      app: firewall
  template:
    metadata:
      labels:
        app: firewall
    spec:
      containers:
        - name: firewall
          image: firewall:latest
          imagePullPolicy: Never
          command:
            - /bin/sh
            - -c
            - sleep infinity
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command:
                - test
                - -f
                - /etc/nftables.conf
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - test
                - -f
                - /etc/nftables.conf
            initialDelaySeconds: 5
            periodSeconds: 10
          ports:
            - name: ssh
              containerPort: 22
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          volumeMounts:
            - name: firewall-config
              mountPath: /etc/nftables.conf
              subPath: nftables.conf
      volumes:
        - name: firewall-config
          configMap:
            name: firewall-config
