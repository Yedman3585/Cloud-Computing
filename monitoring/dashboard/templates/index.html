<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Firewall Monitoring</title>
    <style>
        body { font-family: monospace; margin: 20px; background: #0a0e1a; color: #00ffcc; }
        h1 { color: #00ffcc; border-bottom: 1px solid #00ffcc; }
        .card { background: #111827; padding: 20px; margin: 15px 0; border-radius: 8px; }
        pre { background: #000; padding: 15px; color: #0f0; overflow-x: auto; border-radius: 5px; }
        .timestamp { color: #888; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Firewall Monitoring Dashboard</h1>
    <div class="timestamp" id="timestamp"></div>

    <div class="card">
        <h2>Top Blocked IPs</h2>
        <pre id="blocked">Loading...</pre>
    </div>

    <div class="card">
        <h2>Active Connections</h2>
        <pre id="connections">Loading...</pre>
    </div>

    <div class="card">
        <h2>Health</h2>
        <pre id="health">Loading...</pre>
    </div>

    <script>
        function refresh() {
            for (const endpoint of ["blocked", "connections", "health"]) {
                fetch(`/api/${endpoint}`)
                    .then((response) => response.json())
                    .then((data) => {
                        document.getElementById(endpoint).textContent =
                            JSON.stringify(data, null, 2);
                    });
            }
            document.getElementById("timestamp").textContent =
                "Last update: " + new Date().toLocaleString();
        }

        refresh();
        setInterval(refresh, 5000);
    </script>
</body>
</html>
