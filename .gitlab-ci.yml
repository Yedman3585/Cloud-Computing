workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

stages:
  - validate
  - package

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_CACHE_DIR: "1"

python:syntax:
  stage: validate
  image: python:3.11-slim
  script:
    - python -m compileall -q ansible/library scripts tests monitoring render.py

ansible:syntax:
  stage: validate
  image: python:3.11-slim
  before_script:
    - python -m pip install ansible-core jinja2 pyyaml
  script:
    - ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook --syntax-check ansible/playbooks/site.yml
    - ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook --syntax-check ansible/playbooks/run_tests.yml

compose:config:
  stage: validate
  image: docker:27-cli
  before_script:
    - apk add --no-cache docker-cli-compose
  script:
    - docker compose config --quiet

k8s:yaml:
  stage: validate
  image: python:3.11-slim
  before_script:
    - python -m pip install pyyaml
  script:
    - python scripts/validate_k8s_yaml.py

helm:template:
  stage: validate
  image:
    name: alpine/helm:3.14.4
    entrypoint: [""]
  script:
    - helm lint helm/firewall-chart
    - helm template firewall-lab helm/firewall-chart --namespace firewall >/tmp/firewall-chart.yaml

monitoring:syntax:
  stage: validate
  image: python:3.11-slim
  script:
    - python -m compileall -q monitoring
    - python -c "from monitoring.analyzers.log_analyzer import analyze_logs; result = analyze_logs('/tmp/missing-firewall.log'); assert result['total'] == 0"

docker:image-build:
  stage: package
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -f docker/DockerFile -t firewall-lab:ci .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
