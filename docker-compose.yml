# =============================================================================
# Scalable HA Firewall — Docker Compose
# Topic 5.2 — Group 05
#
# NETWORKS:
#   mgmt_net     172.20.0.0/24  — Keepalived VRRP, conntrackd sync, Ansible SSH
#   frontend_net 172.21.0.0/24  — untrusted client side
#   backend_net  172.22.0.0/24  — protected server side
#
# VIP: 172.20.0.100 — owned by MASTER fw node, taken over on failover
# =============================================================================
version: "3.8"

# ---------------------------------------------------------------------------
# NETWORKS — 3 isolated bridge networks
# ---------------------------------------------------------------------------
networks:
  mgmt_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-mgmt
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
    enable_ipv6: false

  frontend_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-frontend
    ipam:
      config:
        - subnet: 172.21.0.0/24
          gateway: 172.21.0.1

  backend_net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-backend
    ipam:
      config:
        - subnet: 172.22.0.0/24
          gateway: 172.22.0.1

# ---------------------------------------------------------------------------
# VOLUMES
# ---------------------------------------------------------------------------
volumes:
  fw1_logs:
  fw2_logs:
  fw3_logs:
  test_results:

# ---------------------------------------------------------------------------
# SERVICES
# ---------------------------------------------------------------------------
services:

  # ── FIREWALL NODES ─────────────────────────────────────────────────────
  # All three build from the same DockerFile.
  # Ansible + environment variables differentiate their roles at runtime.

  fw1:
    build:
      context: .
      dockerfile: docker/DockerFile      # BUG FIX: was "docker/Dockerfile" (wrong case)
    container_name: fw1
    hostname: fw1
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1
      net.ipv4.ip_nonlocal_bind: 1
    networks:
      mgmt_net:
        ipv4_address: 172.20.0.11
      frontend_net:
        ipv4_address: 172.21.0.11
      backend_net:
        ipv4_address: 172.22.0.11
    volumes:
      - fw1_logs:/var/log
      - ./tests:/tests:ro
    environment:
      - NODE_ROLE=master
      - KEEPALIVED_PRIORITY=110
      - VRRP_PEER1=172.20.0.12
      - VRRP_PEER2=172.20.0.13
      - VIRTUAL_IP=172.20.0.100
    healthcheck:
      test: ["CMD", "nft", "list", "ruleset"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  fw2:
    build:
      context: .
      dockerfile: docker/DockerFile
    container_name: fw2
    hostname: fw2
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1
      net.ipv4.ip_nonlocal_bind: 1
    networks:
      mgmt_net:
        ipv4_address: 172.20.0.12
      frontend_net:
        ipv4_address: 172.21.0.12
      backend_net:
        ipv4_address: 172.22.0.12
    volumes:
      - fw2_logs:/var/log
      - ./tests:/tests:ro
    environment:
      - NODE_ROLE=backup
      - KEEPALIVED_PRIORITY=100
      - VRRP_PEER1=172.20.0.11
      - VRRP_PEER2=172.20.0.13
      - VIRTUAL_IP=172.20.0.100
    healthcheck:
      test: ["CMD", "nft", "list", "ruleset"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  fw3:
    build:
      context: .
      dockerfile: docker/DockerFile
    container_name: fw3
    hostname: fw3
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.forwarding: 1
      net.ipv4.ip_nonlocal_bind: 1
    networks:
      mgmt_net:
        ipv4_address: 172.20.0.13
      frontend_net:
        ipv4_address: 172.21.0.13
      backend_net:
        ipv4_address: 172.22.0.13
    volumes:
      - fw3_logs:/var/log
      - ./tests:/tests:ro
    environment:
      - NODE_ROLE=backup
      - KEEPALIVED_PRIORITY=90
      - VRRP_PEER1=172.20.0.11
      - VRRP_PEER2=172.20.0.12
      - VIRTUAL_IP=172.20.0.100
    healthcheck:
      test: ["CMD", "nft", "list", "ruleset"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── CLIENT NODES ────────────────────────────────────────────────────────
  # Sit on frontend_net — represent untrusted traffic sources.
  # Used by scapy tests to send crafted packets toward the firewall.

  client1:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: client1
    hostname: client1
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      frontend_net:
        ipv4_address: 172.21.0.21
    volumes:
      - ./tests:/tests:ro
      - test_results:/test_results
    environment:
      - FW1_IP=172.21.0.11
      - FW2_IP=172.21.0.12
      - FW3_IP=172.21.0.13
    depends_on:
      fw1:
        condition: service_healthy
    restart: unless-stopped

  client2:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: client2
    hostname: client2
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      frontend_net:
        ipv4_address: 172.21.0.22
    volumes:
      - ./tests:/tests:ro
      - test_results:/test_results
    environment:
      - FW1_IP=172.21.0.11
      - FW2_IP=172.21.0.12
      - FW3_IP=172.21.0.13
    depends_on:
      fw1:
        condition: service_healthy
    restart: unless-stopped

  client3:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: client3
    hostname: client3
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      frontend_net:
        ipv4_address: 172.21.0.23
    volumes:
      - ./tests:/tests:ro
      - test_results:/test_results
    environment:
      - FW1_IP=172.21.0.11
      - FW2_IP=172.21.0.12
      - FW3_IP=172.21.0.13
    depends_on:
      fw1:
        condition: service_healthy
    restart: unless-stopped

  # ── BACKEND SERVERS ─────────────────────────────────────────────────────
  # Protected services behind the firewall on backend_net.
  # nginx serves as a simple HTTP target for connectivity tests.

  server1:
    image: nginx:alpine
    container_name: server1
    hostname: server1
    networks:
      backend_net:
        ipv4_address: 172.22.0.31
    volumes:
      - ./docker/nginx/server1.html:/usr/share/nginx/html/index.html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  server2:
    image: nginx:alpine
    container_name: server2
    hostname: server2
    networks:
      backend_net:
        ipv4_address: 172.22.0.32
    volumes:
      - ./docker/nginx/server2.html:/usr/share/nginx/html/index.html:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ── TEST RUNNER ─────────────────────────────────────────────────────────
  # Dedicated container that runs the full pytest suite.
  # Uses 'profiles: testing' so it does NOT start with 'docker compose up'.
  # Launch manually: docker compose --profile testing run --rm test_runner
  # Or via Ansible: the run_tests.yml playbook starts it automatically.

  test_runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: test_runner
    hostname: test_runner
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      mgmt_net:
        ipv4_address: 172.20.0.99
      frontend_net:
        ipv4_address: 172.21.0.99
      backend_net:
        ipv4_address: 172.22.0.99
    volumes:
      - ./tests:/tests
      - test_results:/test_results
    environment:
      - FW1_MGMT_IP=172.20.0.11
      - FW2_MGMT_IP=172.20.0.12
      - FW3_MGMT_IP=172.20.0.13
      - FW1_FRONTEND_IP=172.21.0.11
      - FW2_FRONTEND_IP=172.21.0.12
      - FW3_FRONTEND_IP=172.21.0.13
      - VIRTUAL_IP=172.20.0.100
      - SERVER1_IP=172.22.0.31
      - SERVER2_IP=172.22.0.32
      - REPORT_DIR=/test_results
    depends_on:
      fw1:
        condition: service_healthy
      fw2:
        condition: service_healthy
      fw3:
        condition: service_healthy
      server1:
        condition: service_healthy
      server2:
        condition: service_healthy
    profiles:
      - testing
    command: >
      pytest /tests
        --json-report
        --json-report-file=/test_results/pytest.json
        --html=/test_results/report.html
        --self-contained-html
        -v
