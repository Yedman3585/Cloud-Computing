# Keepalived config for fw1 — MASTER (priority 110)
vrrp_instance VI_1 {
    state MASTER
    interface eth0
    virtual_router_id 51
    priority 110
    advert_int 1

    # Unicast mode — required for Docker/container environments
    # (multicast VRRP is blocked by most container runtimes)
    unicast_src_ip 172.20.0.11
    unicast_peer {
        172.20.0.12
        172.20.0.13
    }

    authentication {
        auth_type PASS
        auth_pass secret123
    }

    virtual_ipaddress {
        172.20.0.100/24
    }
}
