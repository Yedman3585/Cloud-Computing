# Keepalived config for fw2 — BACKUP (priority 100)
vrrp_instance VI_1 {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 100
    advert_int 1

    unicast_src_ip 172.20.0.12
    unicast_peer {
        172.20.0.11
        172.20.0.13
    }

    authentication {
        auth_type PASS
        auth_pass secret123
    }

    virtual_ipaddress {
        172.20.0.100/24
    }
}
