# Keepalived config for fw3 — BACKUP (priority 90)
vrrp_instance VI_1 {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 90
    advert_int 1

    unicast_src_ip 172.20.0.13
    unicast_peer {
        172.20.0.11
        172.20.0.12
    }

    authentication {
        auth_type PASS
        auth_pass secret123
    }

    virtual_ipaddress {
        172.20.0.100/24
    }
}
