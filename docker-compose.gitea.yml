# Compose override used only by Gitea Actions.
# The self-hosted Gitea runner executes jobs inside a Docker container while
# talking to the host Docker daemon through /var/run/docker.sock. Host bind
# mounts from the repository workspace are therefore not reliable there, so
# this file removes those binds and writes tiny nginx fixtures at container
# startup instead.
services:
  fw1:
    volumes: !override []
  fw2:
    volumes: !override []
  fw3:
    volumes: !override []

  client1:
    volumes: !override []
  client2:
    volumes: !override []
  client3:
    volumes: !override []
  traffic-gen:
    volumes: !override []

  server1:
    volumes: !override []
    command:
      - /bin/sh
      - -c
      - |
        cat > /usr/share/nginx/html/index.html <<'EOF'
        <!DOCTYPE html>
        <html><body><h1>server1 - backend OK</h1></body></html>
        EOF
        nginx -g 'daemon off;'

  server2:
    volumes: !override []
    command:
      - /bin/sh
      - -c
      - |
        cat > /etc/nginx/conf.d/default.conf <<'EOF'
        server {
            listen 80;
            listen [::]:80;
            listen 8080;
            listen [::]:8080;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
        }
        EOF
        cat > /usr/share/nginx/html/index.html <<'EOF'
        <!DOCTYPE html>
        <html><body><h1>server2 - backend OK</h1></body></html>
        EOF
        nginx -g 'daemon off;'

  test_runner:
    volumes: !override []