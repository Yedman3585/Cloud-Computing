name: Firewall CI/CD

on:
  push:
    branches:
      - main
      - kubernetes-final

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t firewall:latest -f docker/Dockerfile .

  helm:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        run: |
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Helm Lint
        run: |
          helm lint helm/firewall-chart

      - name: Helm Template
        run: |
          helm template firewall-release helm/firewall-chart

  validation:
    runs-on: ubuntu-latest
    needs: helm

    steps:
      - uses: actions/checkout@v4

      - name: Python Syntax
        run: |
          python3 -m py_compile scripts/check_firewall.py

  deploy:
    runs-on: ubuntu-latest
    needs: validation

    steps:
      - name: Simulated Deploy
        run: |
          echo "Firewall deployment successful"
