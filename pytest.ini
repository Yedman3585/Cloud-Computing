[pytest]
# Where pytest looks for tests
testpaths = tests

# Minimum pytest version required
minversion = 7.0

# Default options added to every pytest run:
#   -v          = verbose: print each test name and result
#   --tb=short  = on failure, show a short traceback (not the full wall of text)
#   -p no:cacheprovider = disable .pytest_cache folder (cleaner in CI)
addopts =
    -v
    --tb=short
    -p no:cacheprovider

# Custom markers — suppress "PytestUnknownMarkWarning" warnings.
# Add @pytest.mark.<name> to any test to categorize it.
markers =
    slow: marks tests that take more than 30 seconds (failover, recovery)
    ipv6: marks tests that require IPv6 to be enabled in Docker
    scapy: marks tests that use raw packet crafting (require NET_RAW capability)
    smoke: marks quick sanity-check tests (run first to catch obvious issues)

# Show local variables in tracebacks — helps debug test failures
# (shows the values of variables at the point of failure)
# Disable if output is too noisy: set to false
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %H:%M:%S
