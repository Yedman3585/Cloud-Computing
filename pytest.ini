[pytest]
testpaths = tests
minversion = 7.0
pythonpath =
    tests
addopts =
    -v
    --tb=short
    -p no:cacheprovider
markers =
    slow: tests that take more than 30 seconds
    ipv6: tests that require Docker IPv6
    scapy: tests that use raw packet crafting
    smoke: quick sanity checks
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)s %(message)s
log_date_format = %H:%M:%S
