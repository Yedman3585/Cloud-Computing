---
common_packages:
  - nftables
  - keepalived
  - conntrackd
  - conntrack
  - python3
  - python3-apt
  - python3-pip
  - python3-yaml
  - python3-jinja2
  - rsyslog
  - ulogd2
  - iproute2
  - iputils-ping
  - procps
  - ca-certificates

common_diagnostic_packages:
  - tcpdump
  - iftop
  - cbm

common_manage_rsyslog_service: false

firewall_nftables_conf_path: /etc/nftables.conf
firewall_nftables_apply_rules: true
firewall_nftables_manage_service: false
firewall_drop_logging_enabled: true
firewall_nflog_group: 1
firewall_input_drop_log_prefix: "DROP-IN "
firewall_forward_drop_log_prefix: "DROP-FWD "

keepalived_service_mode: supervisor

# Shared VRRP settings used by every instance below.
keepalived_cluster:
  name: firewall_cluster_main
  advert_int: 1
  auth_pass: fwha2026
  enable_ipv6_vip: false

# One VRRP instance per network the firewall sits on. All three are always
# owned by the same node (driven by the per-host keepalived_priority in
# inventory/hosts.yml), so failover moves mgmt + frontend + backend VIPs
# together, and routing through the firewall keeps working after failover.
keepalived_vrrp_instances:
  - name: mgmt
    instance_name: VI_1
    interface: "{{ firewall_mgmt_interface | default('pending') }}"
    virtual_router_id: 51
    vip_ipv4: 172.20.0.100/24
    vip_ipv6: fd00:20::100/64
  - name: frontend
    instance_name: VI_2
    interface: "{{ firewall_frontend_interface | default('pending') }}"
    virtual_router_id: 52
    vip_ipv4: 172.21.0.100/24
    vip_ipv6: fd00:21::100/64
  - name: backend
    instance_name: VI_3
    interface: "{{ firewall_backend_interface | default('pending') }}"
    virtual_router_id: 53
    vip_ipv4: 172.22.0.100/24
    vip_ipv6: fd00:22::100/64

conntrackd_service_mode: daemon
conntrackd_interface: eth2
conntrackd_sync_mode: NOTRACK
conntrackd_port: 3780
