---
- name: Destroy Molecule Docker containers
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Remove Molecule instance containers
      community.docker.docker_container:
        name: "{{ item.name }}"
        state: absent
        force_kill: true
      loop: "{{ molecule_yml.platforms }}"

    - name: Reset Molecule instance config
      ansible.builtin.copy:
        content: |
          # Molecule managed

          []
        dest: "{{ molecule_instance_config }}"
        mode: "0600"
