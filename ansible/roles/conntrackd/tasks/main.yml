---
- name: Ensure conntrackd directories exist
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - path: /etc/conntrackd
      mode: "0755"
    - path: /var/log/conntrackd
      mode: "0755"

- name: Render conntrackd synchronization configuration
  become: true
  ansible.builtin.template:
    src: conntrackd.conf.j2
    dest: /etc/conntrackd/conntrackd.conf
    owner: root
    group: root
    mode: "0640"
  notify: Restart conntrackd

- name: Ensure conntrackd is enabled and running
  become: true
  ansible.builtin.service:
    name: conntrackd
    state: started
    enabled: true
