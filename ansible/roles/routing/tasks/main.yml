---
# Applies to test_clients (frontend_net) and backend_servers (backend_net).
# Ensures traffic between the two networks transits the firewall cluster's
# VIPs, so the firewall ruleset can actually be exercised end to end.

- name: Bootstrap Python3 and bash on minimal Alpine backend servers
  # nginx:alpine ships without Python and bash. The raw module works before
  # Python exists on the target, so it is the safest way to prepare these
  # minimal backend containers in local runs and clean CI/Gitea runners.
  ansible.builtin.raw: |
    command -v python3 >/dev/null 2>&1 || apk add --no-cache python3
    command -v bash >/dev/null 2>&1 || apk add --no-cache bash
  when: inventory_hostname in groups['backend_servers']
  changed_when: false

- name: Ensure iproute2 is present on Alpine backend servers
  ansible.builtin.raw: command -v ip >/dev/null 2>&1 || apk add --no-cache iproute2
  when: inventory_hostname in groups['backend_servers']
  changed_when: false

- name: Ensure iproute2 is present on Debian-based test clients
  become: true
  ansible.builtin.package:
    name: iproute2
    state: present
  register: routing_iproute2_install
  failed_when:
    - routing_iproute2_install is failed
    - "'Could not find a package' not in (routing_iproute2_install.msg | default(''))"
  when: inventory_hostname in groups['test_clients']

- name: Add route to backend network via the frontend VIP (test_clients)
  become: true
  ansible.builtin.command:
    cmd: >-
      ip route replace {{ routing_backend_subnet_ipv4 }}
      via {{ routing_frontend_vip_ipv4 }}
  changed_when: true
  when: inventory_hostname in groups['test_clients']

- name: Add route to frontend network via the backend VIP (backend_servers)
  become: true
  ansible.builtin.command:
    cmd: >-
      ip route replace {{ routing_frontend_subnet_ipv4 }}
      via {{ routing_backend_vip_ipv4 }}
  changed_when: true
  when: inventory_hostname in groups['backend_servers']
