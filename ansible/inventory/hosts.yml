all:
  vars:
    # --- SSH connection settings for ALL hosts ---
    ansible_user: root
    ansible_password: firewall
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
    ansible_python_interpreter: /usr/bin/python3

    # --- Shared firewall variables (mirrors vars.yml) ---
    virtual_ip: "172.20.0.100"
    allowed_ports: [22, 80, 443]
    allowed_ips:
      - "192.168.64.0/24"
      - "10.0.0.0/8"
    allowed_ipv6:
      - "::1/128"
      - "fd00::/8"

  children:

    # ── Firewall nodes ──────────────────────────────────────────────────────
    # Ansible connects to the management IP of each fw container.
    # These IPs are static — assigned in docker-compose.yml.
    firewall_nodes:
      hosts:
        fw1:
          ansible_host: 172.20.0.11        # mgmt_net IP for fw1
          keepalived_state: MASTER
          keepalived_priority: 110
          keepalived_peers:
            - 172.20.0.12
            - 172.20.0.13
          conntrackd_src: 172.20.0.11
          conntrackd_dst: 172.20.0.12

        fw2:
          ansible_host: 172.20.0.12
          keepalived_state: BACKUP
          keepalived_priority: 100
          keepalived_peers:
            - 172.20.0.11
            - 172.20.0.13
          conntrackd_src: 172.20.0.12
          conntrackd_dst: 172.20.0.11

        fw3:
          ansible_host: 172.20.0.13
          keepalived_state: BACKUP
          keepalived_priority: 90
          keepalived_peers:
            - 172.20.0.11
            - 172.20.0.12
          conntrackd_src: 172.20.0.13
          conntrackd_dst: 172.20.0.11

    # ── Backend servers ─────────────────────────────────────────────────────
    backend_servers:
      hosts:
        server1:
          ansible_host: 172.22.0.31
          ansible_user: root
        server2:
          ansible_host: 172.22.0.32
          ansible_user: root

    # ── Test runner ─────────────────────────────────────────────────────────
    # localhost = the machine running docker compose and ansible
    test_runner:
      hosts:
        localhost:
          ansible_connection: local   # no SSH needed — runs on the same machine
